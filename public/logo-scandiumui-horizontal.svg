<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(206, 100%, 85%)"/>
      <stop offset="100%" stop-color="hsl(206, 80%, 65%)"/>
    </linearGradient>
  </defs>

  <!-- Android head -->
  <path d="M24 38 C24 22, 66 22, 66 38 L66 48 C66 52, 24 52, 24 48 Z" fill="none" stroke="url(#hGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="36" cy="40" r="3" fill="hsl(206, 100%, 81%)"/>
  <circle cx="54" cy="40" r="3" fill="hsl(206, 100%, 81%)"/>
  <!-- Antennas -->
  <line x1="38" y1="24" x2="33" y2="16" stroke="hsl(206, 100%, 81%)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="24" x2="57" y2="16" stroke="hsl(206, 100%, 81%)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="24" y="54" width="42" height="30" rx="4" fill="none" stroke="url(#hGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arms -->
  <rect x="15" y="58" width="6" height="20" rx="3" fill="none" stroke="hsl(206, 100%, 81%)" stroke-width="2.5"/>
  <rect x="69" y="58" width="6" height="20" rx="3" fill="none" stroke="hsl(206, 100%, 81%)" stroke-width="2.5"/>
  <!-- Legs -->
  <rect x="32" y="84" width="7" height="14" rx="3.5" fill="none" stroke="hsl(206, 100%, 81%)" stroke-width="2.5"/>
  <rect x="51" y="84" width="7" height="14" rx="3.5" fill="none" stroke="hsl(206, 100%, 81%)" stroke-width="2.5"/>

  <!-- Text -->
  <text x="100" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="30" fill="hsl(206, 100%, 94%)" letter-spacing="0.5">Scandium</text>
  <text x="100" y="78" font-family="'Segoe UI', system-ui, sans-serif" font-weight="300" font-size="22" fill="hsl(206, 100%, 81%)" letter-spacing="4">UI</text>
</svg>
