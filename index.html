<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ScandiumOS is an AOSP based custom ROM, focused on performance and customization. A new experience awaits you.">
  <meta name="keywords" content="ScandiumOS, OpenSource, Custom ROM, Android, Gaming, Performance, Customization, Wiki, AOSP">
  <meta name="theme-color" content="#1b1b22">
  <meta property="og:title" content="ScandiumOS — A new experience awaits you">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Give a new life to your phone. Faster and better-looking than ever. ScandiumOS is an AOSP-based custom ROM.">
  <meta property="og:url" content="https://scandiumui.tech">
  <meta property="og:site_name" content="ScandiumOS">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ScandiumOS">
  <meta name="twitter:description" content="A new experience awaits you. Give a new life to your phone.">
  <title>ScandiumOS</title>
  <link rel="shortcut icon" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <script>
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && e.key === 'I') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && e.key === 'J') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && e.key === 'C') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.key === 's') { e.preventDefault(); return false; }
    });

    (function() {
      var t = new Image();
      Object.defineProperty(t, 'id', { get: function() {
        document.body.innerHTML = '';
        window.location.href = 'about:blank';
      }});
      setInterval(function() { console.log(t); console.clear(); }, 1000);
    })();
  </script>
</body>
</html>
